[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "createclip"
version = "0.1.0"
description = "Kick VOD -> best-moment clips (chat peaks) with optional Turkish word-by-word captions, fully local"
requires-python = ">=3.10"
dependencies = ["pillow", "fastapi", "uvicorn", "mlx-whisper"]

[project.optional-dependencies]
dev = ["pytest"]
face = ["opencv-python-headless<5"]

[project.scripts]
createclip = "createclip.cli:main"

[tool.setuptools]
packages = ["createclip"]

[tool.setuptools.package-data]
createclip = ["fonts/*.ttf", "web/*.html"]
