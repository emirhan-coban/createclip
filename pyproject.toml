[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoshorts"
version = "0.1.0"
description = "Video link -> best moments -> vertical clips saved to a folder (yt-dlp, clip finder, ffmpeg)"
requires-python = ">=3.10"
dependencies = ["fastapi", "uvicorn"]     # the local web app; the machine also needs ffmpeg and yt-dlp

[project.optional-dependencies]
dev = ["pytest", "httpx", "pillow"]
faces = ["opencv-python-headless"]   # find the streamer's camera for the face-on-top layout
editor = ["pillow"]          # text layers in the clip editor
speech = ["mlx-whisper"]     # sentence-aware cuts and speech titles: Whisper on Apple Silicon
clipsai = ["clipsai"]      # transcript-based finder (also needs whisperx; Python <= 3.12 recommended)

[project.scripts]
autoshorts = "autoshorts.cli:main"

[tool.setuptools]
packages = ["autoshorts", "autoshorts.sources"]

[tool.setuptools.package-data]
autoshorts = ["fonts/*.ttf", "webdist/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
