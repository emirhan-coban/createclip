[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoshorts"
version = "0.1.0"
description = "Video link -> best moments -> vertical clips saved to a folder (yt-dlp, clip finder, ffmpeg)"
requires-python = ">=3.10"
dependencies = ["fastapi", "uvicorn"]     # the local web app; the machine also needs ffmpeg and yt-dlp

[project.optional-dependencies]
dev = ["pytest", "httpx"]
captions = ["pillow", "mlx-whisper"]   # word-by-word captions: Whisper on Apple Silicon + Pillow
clipsai = ["clipsai"]      # transcript-based finder (also needs whisperx; Python <= 3.12 recommended)

[project.scripts]
autoshorts = "autoshorts.cli:main"

[tool.setuptools]
packages = ["autoshorts", "autoshorts.sources"]

[tool.setuptools.package-data]
autoshorts = ["fonts/*.ttf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
